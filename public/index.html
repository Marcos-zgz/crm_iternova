<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torre de Control - Carreteras</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans p-6">
 <header class="bg-slate-900 text-white shadow-md border-b border-slate-800 -mx-6 -mt-6 mb-8 px-8 py-4 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <span class="text-xl">🛣️</span>
      <div>
        <h1 class="text-xl font-bold tracking-tight text-white leading-none">Torre de Control · Carreteras</h1>
        <p class="text-xs text-slate-400 mt-1 font-mono">Panel operativo de expedientes e inspección</p>
      </div>
    </div>
    <button onclick="cargarExpedientes()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 hover:text-white border border-slate-700 text-xs font-semibold px-4 py-2 rounded-lg transition shadow-sm flex items-center gap-2">
      <span>🔄</span> Actualizar
    </button>
  </header>

  <main class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-6">
    <!-- Columna 1 -->
    <section class="bg-slate-50 border border-slate-200 rounded-xl p-4 flex flex-col h-[80vh]">
      <div class="flex items-center justify-between mb-4 border-b border-slate-200 pb-2">
        <h2 class="font-bold text-slate-700 text-xs tracking-wide uppercase">Requerimientos / Subsanación</h2>
        <span id="badge-requerimiento" class="text-xs bg-slate-200 font-bold px-2 py-0.5 rounded-full text-slate-600">0</span>
      </div>
      <div id="col-requerimiento" class="flex-1 overflow-y-auto space-y-3 p-1 rounded-lg" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="drop(event, 'requerimiento')"></div>
    </section>

    <!-- Columna 2 -->
    <section class="bg-slate-50 border border-slate-200 rounded-xl p-4 flex flex-col h-[80vh]">
      <div class="flex items-center justify-between mb-4 border-b border-slate-200 pb-2">
        <h2 class="font-bold text-slate-700 text-xs tracking-wide uppercase">Visita de Campo</h2>
        <span id="badge-visita_campo" class="text-xs bg-slate-200 font-bold px-2 py-0.5 rounded-full text-slate-600">0</span>
      </div>
      <div id="col-visita_campo" class="flex-1 overflow-y-auto space-y-3 p-1 rounded-lg" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="drop(event, 'visita_campo')"></div>
    </section>

    <!-- Columna 3 -->
    <section class="bg-slate-50 border border-slate-200 rounded-xl p-4 flex flex-col h-[80vh]">
      <div class="flex items-center justify-between mb-4 border-b border-slate-200 pb-2">
        <h2 class="font-bold text-slate-700 text-xs tracking-wide uppercase">Contactar Interesado</h2>
        <span id="badge-contactar_interesado" class="text-xs bg-slate-200 font-bold px-2 py-0.5 rounded-full text-slate-600">0</span>
      </div>
      <div id="col-contactar_interesado" class="flex-1 overflow-y-auto space-y-3 p-1 rounded-lg" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="drop(event, 'contactar_interesado')"></div>
    </section>

    <!-- Columna 4 -->
    <section class="bg-slate-50 border border-slate-200 rounded-xl p-4 flex flex-col h-[80vh]">
      <div class="flex items-center justify-between mb-4 border-b border-slate-200 pb-2">
        <h2 class="font-bold text-sky-800 text-xs tracking-wide uppercase">En su Tejado</h2>
        <span id="badge-informe_externo" class="text-xs bg-sky-100 font-bold px-2 py-0.5 rounded-full text-sky-700">0</span>
      </div>
      <div id="col-informe_externo" class="flex-1 overflow-y-auto space-y-3 p-1 rounded-lg" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="drop(event, 'informe_externo')"></div>
    </section>
  </main>

  <script>
    const COLS = ['requerimiento', 'visita_campo', 'contactar_interesado', 'informe_externo'];

    async function cargarExpedientes() {
      try {
        const res = await fetch('/api/expedientes');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        COLS.forEach(col => {
          const contenedor = document.getElementById(`col-${col}`);
          if (contenedor) contenedor.innerHTML = '';
        });

        data.forEach(exp => {
          const colId = COLS.includes(exp.estado_bloqueo) ? exp.estado_bloqueo : 'requerimiento';
          const contenedor = document.getElementById(`col-${colId}`);
          if (contenedor) contenedor.appendChild(crearTarjeta(exp));
        });

        COLS.forEach(col => {
          const contenedor = document.getElementById(`col-${col}`);
          const badge = document.getElementById(`badge-${col}`);
          if (contenedor && badge) badge.innerText = contenedor.children.length;
        });
      } catch (err) {
        console.error("Error al cargar expedientes:", err);
      }
    }

    function crearTarjeta(exp) {
      const el = document.createElement('article');
      el.id = `card-${exp.codigo}`;
      el.draggable = true;
      el.ondragstart = (e) => e.dataTransfer.setData('text/plain', exp.codigo);
      el.className = 'bg-white p-4 rounded-xl shadow-sm border border-slate-200 hover:shadow-md transition cursor-grab active:cursor-grabbing';

      let circulo = 'bg-slate-300 ring-slate-100 text-slate-600';
      let badgeTexto = 'Sin plazo';

      if (exp.estado_bloqueo === 'informe_externo') {
        circulo = 'bg-sky-500 ring-sky-200';
        badgeTexto = 'En su tejado';
      } else if (exp.fecha_limite) {
        const hoy = new Date();
        hoy.setHours(0,0,0,0);
        const limite = new Date(exp.fecha_limite);
        limite.setHours(0,0,0,0);
        const diffDias = Math.ceil((limite - hoy) / (1000 * 60 * 60 * 24));

        if (diffDias < 0) {
          circulo = 'bg-rose-600 ring-rose-200 animate-pulse';
          badgeTexto = `Vencido (${Math.abs(diffDias)}d)`;
        } else if (diffDias <= 5) {
          circulo = 'bg-rose-500 ring-rose-200 animate-pulse';
          badgeTexto = `¡${diffDias}d restantes!`;
        } else if (diffDias <= 15) {
          circulo = 'bg-amber-500 ring-amber-200';
          badgeTexto = `${diffDias}d restantes`;
        } else {
          circulo = 'bg-emerald-500 ring-emerald-200';
          badgeTexto = `${diffDias}d restantes`;
        }
      }

      const linkHtml = exp.url_iternova 
        ? `<a href="${exp.url_iternova}" target="_blank" title="Abrir en IterNova" class="font-bold text-blue-700 hover:text-blue-900 hover:underline text-base tracking-tight inline-flex items-center gap-1">${exp.codigo} <span class="text-xs">↗</span></a>`
        : `<span class="font-bold text-slate-900 text-base tracking-tight">${exp.codigo}</span>`;

      el.innerHTML = `
        <div class="flex items-center justify-between gap-3 mb-2">
          <div class="flex items-center gap-2.5">
            <span title="${badgeTexto}" class="w-6 h-6 rounded-full ring-4 ${circulo} flex-shrink-0"></span>
            ${linkHtml}
          </div>
          <button onclick="archivarExpediente('${exp.codigo}')" title="Dar por resuelto y borrar" class="text-slate-400 hover:text-emerald-700 hover:bg-emerald-50 px-2 py-1 rounded text-xs font-semibold border border-transparent hover:border-emerald-200 transition">
            ✓ Hecho
          </button>
        </div>
        
        <p class="font-medium text-slate-800 text-xs mb-2 leading-snug">${exp.titulo || 'Sin descripción'}</p>
        
        <div class="inline-flex items-center gap-1.5 text-xs font-mono font-semibold bg-slate-100 text-slate-700 px-2 py-0.5 rounded mb-2">
          🛣️ ${exp.localizacion || 'Carretera / PK no asignado'}
        </div>

        ${exp.notas ? `<div class="text-xs bg-amber-50 border-l-2 border-amber-400 p-1.5 text-amber-900 rounded-r mb-2">📝 ${exp.notas}</div>` : ''}

        <div class="flex items-center justify-between text-[11px] text-slate-400 pt-1.5 border-t border-slate-100">
          <span>Límite: ${exp.fecha_limite || 'N/A'}</span>
          <span class="font-semibold text-slate-600">${badgeTexto}</span>
        </div>
      `;
      return el;
    }

    async function archivarExpediente(codigo) {
      if (!confirm(`¿Eliminar definitivamente el expediente ${codigo} del panel?`)) return;

      const tarjeta = document.getElementById(`card-${codigo}`);
      if (tarjeta) {
        tarjeta.style.opacity = '0.3';
        tarjeta.style.pointerEvents = 'none';
      }

      try {
        const res = await fetch('/api/expedientes', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ codigo: codigo })
        });

        if (res.ok) {
          if (tarjeta) tarjeta.remove();
          COLS.forEach(col => {
            const count = document.getElementById(`col-${col}`).children.length;
            document.getElementById(`badge-${col}`).innerText = count;
          });
        } else {
          throw new Error(`Error ${res.status}`);
        }
      } catch (err) {
        alert(`Error al eliminar: ${err.message}`);
        if (tarjeta) {
          tarjeta.style.opacity = '1';
          tarjeta.style.pointerEvents = 'auto';
        }
      }
    }

    function allowDrop(e) {
      e.preventDefault();
      e.currentTarget.classList.add('bg-slate-200/50');
    }

    function dragLeave(e) {
      e.currentTarget.classList.remove('bg-slate-200/50');
    }

    async function drop(e, nuevoEstado) {
      e.preventDefault();
      e.currentTarget.classList.remove('bg-slate-200/50');
      const codigo = e.dataTransfer.getData('text/plain');
      const tarjeta = document.getElementById(`card-${codigo}`);
      if (!tarjeta) return;

      e.currentTarget.appendChild(tarjeta);

      COLS.forEach(col => {
        const count = document.getElementById(`col-${col}`).children.length;
        document.getElementById(`badge-${col}`).innerText = count;
      });

      try {
        await fetch('/api/expedientes', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ codigo: codigo, estado_bloqueo: nuevoEstado })
        });
        cargarExpedientes();
      } catch (err) {
        console.error("Error al mover:", err);
      }
    }

    cargarExpedientes();
  </script>
</body>
</html>
