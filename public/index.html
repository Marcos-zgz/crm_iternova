<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torre de Control - Expedientes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .drag-over { background-color: rgba(203, 213, 225, 0.6); border: 2px dashed #64748b; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">

  <header class="bg-slate-900 text-white shadow">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold tracking-wide">Torre de Control IterNova</h1>
        <p class="text-xs text-slate-400">Arrastra tarjetas entre columnas o resuélvelas</p>
      </div>
      <button onclick="cargarExpedientes()" class="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 rounded text-sm font-medium transition shadow">
        ↻ Actualizar
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      
      <!-- Columna 1 -->
      <section class="bg-slate-200/80 p-3 rounded-lg flex flex-col min-h-[500px]">
        <div class="flex items-center justify-between mb-3 border-b border-slate-300 pb-2">
          <h2 class="font-semibold text-slate-700 text-sm">Requerimientos / Subsanación</h2>
          <span id="badge-requerimiento" class="text-xs bg-slate-300 text-slate-800 px-2.5 py-0.5 rounded-full font-bold">0</span>
        </div>
        <div id="col-requerimiento" data-col="requerimiento" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="drop(event)" class="space-y-3 flex-1 overflow-y-auto rounded p-1 transition-colors"></div>
      </section>

      <!-- Columna 2 -->
      <section class="bg-slate-200/80 p-3 rounded-lg flex flex-col min-h-[500px]">
        <div class="flex items-center justify-between mb-3 border-b border-slate-300 pb-2">
          <h2 class="font-semibold text-slate-700 text-sm">Visita de Campo</h2>
          <span id="badge-visita_campo" class="text-xs bg-slate-300 text-slate-800 px-2.5 py-0.5 rounded-full font-bold">0</span>
        </div>
        <div id="col-visita_campo" data-col="visita_campo" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="drop(event)" class="space-y-3 flex-1 overflow-y-auto rounded p-1 transition-colors"></div>
      </section>

      <!-- Columna 3 -->
      <section class="bg-slate-200/80 p-3 rounded-lg flex flex-col min-h-[500px]">
        <div class="flex items-center justify-between mb-3 border-b border-slate-300 pb-2">
          <h2 class="font-semibold text-slate-700 text-sm">Contactar Interesado</h2>
          <span id="badge-contactar_interesado" class="text-xs bg-slate-300 text-slate-800 px-2.5 py-0.5 rounded-full font-bold">0</span>
        </div>
        <div id="col-contactar_interesado" data-col="contactar_interesado" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="drop(event)" class="space-y-3 flex-1 overflow-y-auto rounded p-1 transition-colors"></div>
      </section>

      <!-- Columna 4 -->
      <section class="bg-slate-200/80 p-3 rounded-lg flex flex-col min-h-[500px]">
        <div class="flex items-center justify-between mb-3 border-b border-slate-300 pb-2">
          <h2 class="font-semibold text-slate-700 text-sm">En su tejado</h2>
          <span id="badge-informe_externo" class="text-xs bg-slate-300 text-slate-800 px-2.5 py-0.5 rounded-full font-bold">0</span>
        </div>
        <div id="col-informe_externo" data-col="informe_externo" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="drop(event)" class="space-y-3 flex-1 overflow-y-auto rounded p-1 transition-colors"></div>
      </section>

    </div>
  </main>

  <script>
    const COLS = ['requerimiento', 'visita_campo', 'contactar_interesado', 'informe_externo'];

    async function cargarExpedientes() {
      try {
        const res = await fetch('/api/expedientes');
        const items = await res.json();
        
        COLS.forEach(col => {
          document.getElementById(`col-${col}`).innerHTML = '';
          document.getElementById(`badge-${col}`).innerText = '0';
        });

        items.forEach(exp => {
          const target = document.getElementById(`col-${exp.estado_bloqueo}`) || document.getElementById('col-requerimiento');
          target.appendChild(crearTarjeta(exp));
        });

        COLS.forEach(col => {
          const count = document.getElementById(`col-${col}`).children.length;
          document.getElementById(`badge-${col}`).innerText = count;
        });
      } catch (err) {
        console.error('Error al cargar:', err);
      }
    }

function crearTarjeta(exp) {
  const el = document.createElement('article');
  el.id = `card-${exp.codigo}`;
  el.draggable = true;
  el.ondragstart = (e) => e.dataTransfer.setData('text/plain', exp.codigo);
  el.className = 'bg-white p-4 rounded-xl shadow-sm border border-slate-200 hover:shadow-md transition cursor-grab active:cursor-grabbing';

  let circulo = 'bg-slate-300 ring-slate-100 text-slate-600';
  let badgeTexto = 'Sin plazo';

  if (exp.estado_bloqueo === 'informe_externo') {
    circulo = 'bg-sky-500 ring-sky-200';
    badgeTexto = 'En su tejado';
  } else if (exp.fecha_limite) {
    const hoy = new Date();
    hoy.setHours(0,0,0,0);
    const limite = new Date(exp.fecha_limite);
    limite.setHours(0,0,0,0);
    const diffDias = Math.ceil((limite - hoy) / (1000 * 60 * 60 * 24));

    if (diffDias < 0) {
      circulo = 'bg-rose-600 ring-rose-200 animate-pulse';
      badgeTexto = `Vencido (${Math.abs(diffDias)}d)`;
    } else if (diffDias <= 5) {
      circulo = 'bg-rose-500 ring-rose-200 animate-pulse';
      badgeTexto = `¡${diffDias}d restantes!`;
    } else if (diffDias <= 15) {
      circulo = 'bg-amber-500 ring-amber-200';
      badgeTexto = `${diffDias}d restantes`;
    } else {
      circulo = 'bg-emerald-500 ring-emerald-200';
      badgeTexto = `${diffDias}d restantes`;
    }
  }

  // Enlace a IterNova si existe URL
  const linkHtml = exp.url_iternova 
    ? `<a href="${exp.url_iternova}" target="_blank" title="Abrir expediente en IterNova" class="font-bold text-blue-700 hover:text-blue-900 hover:underline text-base tracking-tight inline-flex items-center gap-1">${exp.codigo} <span class="text-xs">↗</span></a>`
    : `<span class="font-bold text-slate-900 text-base tracking-tight">${exp.codigo}</span>`;

  el.innerHTML = `
    <div class="flex items-center justify-between gap-3 mb-2">
      <div class="flex items-center gap-2.5">
        <span title="${badgeTexto}" class="w-6 h-6 rounded-full ring-4 ${circulo} flex-shrink-0"></span>
        ${linkHtml}
      </div>
      <button onclick="archivarExpediente('${exp.codigo}')" title="Dar por resuelto" class="text-slate-400 hover:text-emerald-700 hover:bg-emerald-50 px-2 py-1 rounded text-xs font-semibold border border-transparent hover:border-emerald-200 transition">
        ✓ Hecho
      </button>
    </div>
    
    <p class="font-medium text-slate-800 text-xs mb-2 leading-snug">${exp.titulo || 'Sin descripción'}</p>
    
    <div class="inline-flex items-center gap-1.5 text-xs font-mono font-semibold bg-slate-100 text-slate-700 px-2 py-0.5 rounded mb-2">
      🛣️ ${exp.localizacion || 'Carretera / PK no asignado'}
    </div>

    ${exp.notas ? `<div class="text-xs bg-amber-50 border-l-2 border-amber-400 p-1.5 text-amber-900 rounded-r mb-2">📝 ${exp.notas}</div>` : ''}

    <div class="flex items-center justify-between text-[11px] text-slate-400 pt-1.5 border-t border-slate-100">
      <span>Límite: ${exp.fecha_limite || 'N/A'}</span>
      <span class="font-semibold text-slate-600">${badgeTexto}</span>
    </div>
  `;
  return el;
}
    // Drag & Drop
    function allowDrop(e) {
      e.preventDefault();
      e.currentTarget.classList.add('drag-over');
    }

    function dragLeave(e) {
      e.currentTarget.classList.remove('drag-over');
    }

    async function drop(e) {
      e.preventDefault();
      const colEl = e.currentTarget;
      colEl.classList.remove('drag-over');
      const codigo = e.dataTransfer.getData('text/plain');
      const nuevoEstado = colEl.getAttribute('data-col');

      if (!codigo || !nuevoEstado) return;

      // Actualizar UI inmediatamente
      const card = document.getElementById(`card-${codigo}`);
      if (card) colEl.appendChild(card);

      // Persistir en D1
      await fetch('/api/expedientes', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ codigo, estado_bloqueo: nuevoEstado })
      });

      cargarExpedientes();
    }

    cargarExpedientes();
  </script>
</body>
</html>
